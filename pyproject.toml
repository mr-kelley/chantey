[project]
name = "chantey"
version = "0.1.0"
description = "Sheet-music pipeline: canonical MusicXML in; audio (piano + hornpipe synth), notation (PDF/SVG), measure diffs, and a side-by-side comparison page out."
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "Mike Kelley" }]
# Heavy runtime dependencies: music21 (parsing/edits/MIDI) and verovio (SVG engraving).
dependencies = [
    "music21>=10,<11",
    "verovio>=6,<7",
]

[project.urls]
Repository = "https://github.com/mr-kelley/chantey"

[project.scripts]
chantey = "chantey.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14,<0.15",
    "pytest>=8,<9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
